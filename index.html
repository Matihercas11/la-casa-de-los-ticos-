<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La casa de los ticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* VOICE: fresco, limpio, tranquilo como una mañana de nieve; se entiende de un vistazo.
   IDEA: una cabaña al pie de las montañas nevadas de Utah (Wasatch), con pinos y nieve cayendo.
   PICTURE: cordilleras en capas con picos nevados y pinos + la casa con techo cubierto de nieve.
   COLOUR and TYPE: azul pizarra profundo, azul hielo, blanco nieve y verde pino; Outfit + Nunito Sans.
   LAYOUT: hero de montañas con la semana, casa en tarjetas, calendario de semanas que se desliza. */
:root{color-scheme:light;
--bg:#eef4f9;--ink:#1b2d40;--soft:#5a6f86;--deep:#1f3550;--slate:#2c4a68;--ice:#a9cde4;--snow:#ffffff;
--panel:#dbe8f2;--card:#ffffff;--line:#c9d8e6;--pine:#2f5d50}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,"Nunito Sans",sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.band{padding:clamp(22px,4vw,44px) max(5vw,16px)}
.wrap{max-width:960px;margin:0 auto}
button:focus-visible,select:focus-visible,.page:focus-visible{outline:3px solid #6fa3c7;outline-offset:3px}

/* hero: montañas */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#1c3352 0%,#3c6489 55%,#9fc2dc 100%);color:#fff;
padding-bottom:clamp(150px,24vw,230px)}
.mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(170px,28vw,280px);pointer-events:none}
.flakes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hc{position:relative;z-index:1;max-width:560px}
.kick{color:var(--ice);font-weight:800;font-size:15px}
.hero h1{font-size:clamp(38px,7vw,60px);margin:6px 0 10px;color:#fff;text-shadow:0 2px 18px #0b1a2c66}
.hero p{margin:0 0 18px;color:#d6e6f2;max-width:34ch}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{width:44px;height:44px;border-radius:50%;border:2px solid #ffffff66;background:#ffffff14;color:#fff;font-size:22px;cursor:pointer}
.range{font:600 20px Outfit;white-space:nowrap}
.btn{height:46px;border:0;border-radius:23px;padding:0 20px;background:linear-gradient(#ffffff,#dbe9f4);color:var(--deep);font:800 15px "Nunito Sans";cursor:pointer;box-shadow:0 6px 16px -6px #0b1a2c99}
select.btn{appearance:none;padding-right:34px;font-size:16px}
.selw{position:relative}.selw::after{content:"▾";position:absolute;right:14px;top:12px;color:var(--deep);pointer-events:none}
.row2{margin-top:14px}

/* casa */
.house{margin-top:clamp(-70px,-7vw,-40px);position:relative;z-index:2}
.roofw{position:relative;filter:drop-shadow(0 -2px 0 #ffffff)}
.roof{height:clamp(64px,10vw,100px);background:linear-gradient(#4a6c8c,#2c4a68);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.roof::before{content:"";position:absolute;inset:0;background:#fff;clip-path:polygon(50% 0,64% 30%,58% 27%,53% 36%,47% 26%,40% 33%,36% 30%)}
.roof span{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font:600 15px Outfit}
.floors{background:var(--slate);border-radius:0 0 28px 28px;padding:12px;display:grid;gap:12px;box-shadow:0 26px 44px -26px #0b1a2caa}
.floor{background:var(--panel);border-radius:22px;padding:18px clamp(12px,3vw,22px) 20px;background-image:radial-gradient(circle at 100% 0,#ffffffaa,#fff0 45%)}
.fh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.fh h2{font-size:24px;color:var(--deep)}
.fh small{color:var(--soft);font-weight:700}
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.per{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 18px -14px #1f355088;border:3px solid transparent}
.per.me{border-color:#6fa3c7}
.pn{display:flex;align-items:center;gap:10px;font:600 19px Outfit;color:var(--deep)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#3c6489,#1f3550);color:#fff;font:600 16px Outfit;flex:none}
.mag{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:1px solid #1f35501f;border-radius:12px;padding:8px 10px;background:var(--c);color:var(--f);
font:800 14px "Nunito Sans";text-align:left;cursor:pointer;box-shadow:inset 0 -3px 0 #1f35501a;transition:transform .15s}
.mag:active{transform:translateY(2px)}
.mag{flex-direction:column;align-items:stretch;gap:6px;padding:10px 12px}
.mt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mt small{font-size:12px;opacity:.85;white-space:nowrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;opacity:.75}
.dots i.on{background:currentColor;opacity:1}
.mag.full{box-shadow:inset 0 0 0 3px #ffffffcc,inset 0 -3px 0 #1f35501a}
.mag.full .mt small::before{content:"✓ "}
/* hoja para registrar días */
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;background:#0b1a2c99;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.sbox{background:#fff;color:var(--ink);width:min(100%,480px);border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 40px -20px #0b1a2c}
@media(min-width:600px){.sheet{align-items:center}.sbox{border-radius:26px}}
.sbox .chip{display:inline-block;background:var(--c);color:var(--f);border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px}
.sbox h3{font-size:26px;margin:10px 0 4px;color:var(--deep)}
.sbox p{margin:0 0 14px;color:var(--soft)}
.prog{height:10px;border-radius:5px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.prog div{height:100%;background:#4f86ad;border-radius:5px;transition:width .2s}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:62px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font:800 13px "Nunito Sans";cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.day b{font:600 18px Outfit}
.day[aria-pressed=true]{background:#2c4a68;border-color:#2c4a68;color:#fff}
.day.tdy{border-color:#6fa3c7}
.day:disabled{opacity:.3;cursor:default}
.shint{font-size:13px;color:var(--soft);margin:12px 0 16px}
.ok{width:100%;height:50px;border:0;border-radius:25px;background:var(--deep);color:#fff;font:800 16px "Nunito Sans";cursor:pointer}
.free{color:var(--soft);font-weight:700;font-size:14px;padding:6px 2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:14px;color:var(--soft);font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--c);box-shadow:0 0 0 1px #1f355033}

/* calendario */
.cal{background:linear-gradient(180deg,var(--bg),#dce9f3);margin-top:20px}
.cal h2{font-size:clamp(28px,4vw,34px);color:var(--deep)}
.cal p{color:var(--soft);margin:6px 0 10px}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 4px 20px}
.page{flex:none;width:230px;scroll-snap-align:start;background:var(--slate);border:0;border-radius:22px;overflow:hidden;cursor:pointer;
text-align:left;padding:0;color:#fff;font:inherit;box-shadow:0 14px 24px -14px #1f3550aa;position:relative}
.page:nth-child(3n+2){background:#3c6489}.page:nth-child(3n){background:#1f3550}
.page.now{background:#4f86ad}
.page.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px #6fa3c7,0 14px 24px -14px #1f3550aa}
.page.past{opacity:.55}
.ph{padding:16px 14px 10px;background:linear-gradient(#ffffff2e,#ffffff0a);border-bottom:3px solid #ffffffcc}
.wk{font:700 13px "Nunito Sans";opacity:.85}
.dr{font:600 22px Outfit}
.days{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;text-align:center;margin-top:8px;font-weight:700}
.days b{display:block;font-size:10px;opacity:.7}
.days .off{opacity:.3}
.days .td span{background:#fff;color:var(--deep);border-radius:50%;display:inline-block;width:22px;height:22px;line-height:22px}
.rows{padding:10px 14px 14px;display:grid;gap:6px;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.row i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;box-shadow:0 0 0 1px #ffffff66}
.row span{flex:1;opacity:.85;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{white-space:nowrap}
.row b.me{text-decoration:underline;text-decoration-thickness:2px}
.note{color:var(--soft);font-size:13px;display:flex;align-items:center;gap:8px}
.note::before{content:"";width:9px;height:9px;border-radius:50%;background:#9fb3c6;flex:none}
.note.ok2::before{background:#3f9b74}
.note.bad{color:#9a3b2f}.note.bad::before{background:#c4553f}
footer{text-align:center;color:var(--soft);font-size:13px;padding:20px;background:#dce9f3}
@media(max-width:700px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:380px){.pn{font-size:17px}.mag{font-size:13px}}
@keyframes fall{to{transform:translateY(60px)}}
.flakes circle{animation:fall 6s linear infinite alternate}
@media(prefers-reduced-motion:reduce){.mag,.prog div{transition:none}.flakes circle{animation:none}}
</style>
</head>
<body>
<header class="band hero">
  <svg class="flakes" aria-hidden="true" id="flakes"></svg>
  <svg class="mtn" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb3cf"/><stop offset="1" stop-color="#b7d1e4"/></linearGradient>
      <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55809f"/><stop offset="1" stop-color="#7ea3c0"/></linearGradient>
      <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4a68"/><stop offset="1" stop-color="#3f6283"/></linearGradient>
      <g id="pine"><path d="M0-46L14-18H7L18 4H9L20 24H-20L-9 4H-18L-7-18H-14Z" fill="#244a42"/><path d="M0-46L6-34L1-36L-5-31Z" fill="#ffffffcc"/><rect x="-3" y="24" width="6" height="8" fill="#3a2f2a"/></g>
    </defs>
    <!-- cordillera lejana -->
    <path d="M0 170L90 120 170 150 260 80 350 140 430 105 520 60 610 130 700 95 790 140 880 70 970 125 1060 90 1140 130 1200 110V280H0Z" fill="url(#far)"/>
    <path d="M260 80l-28 24 14-4 14 10 12-12 16 6zM520 60l-30 26 16-6 12 10 14-12 20 6zM880 70l-28 26 14-6 14 8 12-10 18 4z" fill="#fff" opacity=".9"/>
    <!-- cordillera media (picos tipo Wasatch) -->
    <path d="M0 210L120 150 210 185 330 100 420 165 520 125 640 40 760 150 860 115 980 160 1080 95 1200 160V280H0Z" fill="url(#mid)"/>
    <path d="M330 100l-36 34 18-6 16 14 14-16 20 10 6-4zM640 40l-46 46 22-8 16 18 18-20 24 14 10-6zM1080 95l-34 32 18-6 14 12 14-14 18 8z" fill="#fff"/>
    <!-- primer plano nevado -->
    <path d="M0 240C140 210 260 228 380 214S640 190 780 212 1040 222 1200 200V280H0Z" fill="#ffffff"/>
    <path d="M0 252C160 232 300 246 440 236S700 222 860 240 1080 246 1200 232V280H0Z" fill="#e6f0f7"/>
    <g>
      <use href="#pine" transform="translate(70 232) scale(1.1)"/><use href="#pine" transform="translate(110 238) scale(.8)"/>
      <use href="#pine" transform="translate(1080 222) scale(1.2)"/><use href="#pine" transform="translate(1130 228) scale(.9)"/><use href="#pine" transform="translate(1030 230) scale(.7)"/>
      <use href="#pine" transform="translate(860 236) scale(.75)"/><use href="#pine" transform="translate(300 230) scale(.7)"/>
    </g>
  </svg>
  <div class="wrap"><div class="hc">
    <div class="kick" id="wkLabel2">Semana</div>
    <h1>La casa de los ticos</h1>
    <p>Del lunes 14 de diciembre al 17 de marzo. Cada lunes las tareas rotan solas.</p>
    <div class="bar">
      <button class="nav" id="prev" aria-label="Semana anterior">‹</button>
      <span class="range" id="range">—</span>
      <button class="nav" id="next" aria-label="Semana siguiente">›</button>
    </div>
    <div class="bar row2">
      <span class="selw"><select class="btn" id="me" aria-label="¿Quién sos?"><option value="">Soy…</option></select></span>
      <button class="btn" id="today" hidden>Volver a esta semana</button>
    </div>
  </div></div>
</header>

<main class="band" style="padding-top:0"><div class="wrap">
  <section class="house" aria-label="Tareas por piso">
    <div class="roofw"><div class="roof"><span id="wkLabel"></span></div></div>
    <div class="floors" id="floors"></div>
    <div class="legend" id="legend"></div>
  </section>
</div></main>

<section class="band cal"><div class="wrap">
  <h2>Calendario</h2>
  <p>Deslizá para ver cómo van rotando las semanas. Tocá una para verla en la casa.</p>
  <div class="strip" id="strip"></div>
  <div class="note" id="sync" role="status">Conectando…</div>
</div></section>
<footer>La casa de los ticos</footer>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sbox" id="sbox">
    <span class="chip" id="sChip"></span>
    <h3 id="sTitle"></h3>
    <p id="sSub"></p>
    <div class="prog"><div id="sProg"></div></div>
    <div class="dgrid" id="sDays"></div>
    <div class="shint">Tocá los días en que la hiciste. Tocá de nuevo para quitarlo.</div>
    <button class="ok" id="sheetOk">Listo</button>
  </div>
</div>

<script>
{
/* ---- Supabase (clave pública: se puede ver en el navegador) ---- */
const SB_URL='https://ibqhqsqosdmbmmpkvuib.supabase.co';
const SB_KEY='sb_publishable_VpjDNYgvbCJlN-3v7c-xnw_7wWvf8zy';

/* ---- Datos ---- */
const START='2026-12-14';
const END='2027-03-17';
const FLOORS=[{id:'arriba',name:'Piso de arriba'},{id:'abajo',name:'Piso de abajo'}];
const PEOPLE=[
  {name:'Matías',floor:'arriba'},{name:'Paula',floor:'arriba'},{name:'Lucia',floor:'arriba'},{name:'Saúl',floor:'arriba'},
  {name:'Celeste',floor:'abajo'},{name:'Ryan',floor:'abajo'},{name:'Jorge',floor:'abajo'},{name:'Paz',floor:'abajo'}];
// scope: 'arriba' | 'abajo' rota dentro del piso; 'casa' rota entre quienes quedan libres
const TASKS=[
  {id:'b1',name:'Baño 1',freq:3,scope:'arriba',c:'#dcebf6',f:'#1b2d40'},
  {id:'b2',name:'Baño 2',freq:3,scope:'arriba',c:'#a9cde4',f:'#14283a'},
  {id:'sa',name:'Sala de arriba',freq:1,scope:'arriba',c:'#6fa3c7',f:'#ffffff'},
  {id:'b3',name:'Baño 3',freq:3,scope:'abajo',c:'#c9d4e0',f:'#1b2d40'},
  {id:'sb',name:'Sala de abajo',freq:1,scope:'abajo',c:'#3f6f93',f:'#ffffff'},
  {id:'bb',name:'Basura de los baños',freq:2,scope:'casa',c:'#2f5d50',f:'#eef6f2'},
  {id:'bg',name:'Basura general',freq:2,scope:'casa',c:'#1f3550',f:'#e8f1f8'}];

/* ---- Utilidades de fechas ---- */
const DAY=864e5,$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmt=d=>d.toLocaleDateString('es-CR',{day:'numeric',month:'short'}).replace('.','');
const START_M=parse(START);
const realNow=mondayOf(new Date());
const END_D=parse(END);
const LAST_M=mondayOf(END_D);
const TOTAL=Math.round((LAST_M-START_M)/(7*DAY))+1;
const base=realNow<START_M?START_M:realNow>LAST_M?LAST_M:realNow;
const endOf=m=>{const e=addDays(m,6);return e>END_D?END_D:e};
const weekIdx=m=>Math.round((m-START_M)/(7*DAY));
const mod=(a,n)=>((a%n)+n)%n;

/* ---- Rotación ----
   Baños y sala de cada piso: rotan entre las 4 personas de ese piso.
   Basuras: van a quien quedó libre, priorizando a quien menos veces le ha tocado
   y sin repetir la semana siguiente (justo para los 8). */
const memo=[];
function floorPart(w){
  const out={},by={};PEOPLE.forEach(p=>by[p.name]=[]);
  for(const f of FLOORS){
    const mem=PEOPLE.filter(p=>p.floor===f.id),ft=TASKS.filter(t=>t.scope===f.id);
    ft.forEach((t,j)=>{const p=mem[mod(j+w,mem.length)].name;out[t.id]=p;by[p].push(t)});
  }
  return {out,by};
}
function casaWeek(w){ // w >= 0
  if(memo[w])return memo[w];
  const prev=w>0?casaWeek(w-1):{count:Object.fromEntries(PEOPLE.map(p=>[p.name,0])),last:[]};
  const {by}=floorPart(w),count={...prev.count},pick={},used=[];
  for(const t of TASKS.filter(t=>t.scope==='casa')){
    const cand=PEOPLE.map((p,i)=>({n:p.name,i})).filter(x=>!by[x.n].length&&!used.includes(x.n));
    cand.sort((a,b)=>(prev.last.includes(a.n)-prev.last.includes(b.n))||(count[a.n]-count[b.n])||(mod(a.i-w,8)-mod(b.i-w,8)));
    const n=cand[0].n;pick[t.id]=n;used.push(n);count[n]++;
  }
  return memo[w]={pick,count,last:used};
}
function assign(m){
  const w=weekIdx(m),{out,by}=floorPart(w);
  const pick=casaWeek(Math.max(w,0)).pick;
  for(const t of TASKS.filter(t=>t.scope==='casa')){const p=pick[t.id];out[t.id]=p;by[p].push(t)}
  return {out,by};
}

/* ---- Estado ----
   "Soy…" se guarda en cada dispositivo; los días hechos viven en Supabase. */
let offset=0,me='',done={};
try{me=localStorage.getItem('tareas-me')||''}catch(e){}
const save=()=>{try{localStorage.setItem('tareas-me',me)}catch(e){}};
const cur=()=>addDays(base,offset*7);
const key=(m,t)=>iso(m)+':'+t;
const daysOf=(m,t)=>{const v=done[key(m,t)];return Array.isArray(v)?v:[]};
// la última semana es corta: la meta no pasa de los días que tiene
const goal=(m,t)=>Math.min(t.freq,Math.round((endOf(m)-m)/DAY)+1);

/* ---- Sincronización ---- */
let db=null;
try{db=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
function setSync(text,state){const n=$('sync');n.textContent=text;n.className='note'+(state?' '+state:'')}
function setDays(k,ds){if(ds.length)done[k]=[...new Set(ds)].sort((a,b)=>a-b);else delete done[k]}
function refresh(){renderHouse();if(!$('sheet').hidden)renderSheet()}
async function load(){
  if(!db){setSync('Sin conexión con la base de datos: los cambios no se guardan.','bad');return}
  const {data,error}=await db.from('registros').select('semana,tarea,dia');
  if(error){setSync('No se pudieron cargar los registros. Revisá tu internet.','bad');return}
  const d={};for(const r of data){const k=r.semana+':'+r.tarea;(d[k]||(d[k]=[])).push(r.dia)}
  done={};for(const k in d)setDays(k,d[k]);
  setSync('Sincronizado con toda la casa','ok2');refresh();
}
async function toggle(m,t,i){
  const k=key(m,t),ds=daysOf(m,t),on=!ds.includes(i);
  setDays(k,on?[...ds,i]:ds.filter(x=>x!==i));renderSheet();
  if(!db)return;
  const row={semana:iso(m),tarea:t,dia:i};
  const {error}=on?await db.from('registros').insert(row):await db.from('registros').delete().match(row);
  if(error&&error.code!=='23505'){setSync('No se guardó ese cambio. Probá de nuevo.','bad');load()}
}
if(db){
  db.channel('registros').on('postgres_changes',{event:'*',schema:'public',table:'registros'},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.semana)return load();
    const k=r.semana+':'+r.tarea,ds=(done[k]||[]).filter(x=>x!==r.dia);
    if(p.eventType==='INSERT')ds.push(r.dia);
    setDays(k,ds);refresh();
  }).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
}

/* ---- Render ---- */
function renderHouse(){
  const m=cur(),a=assign(m),w=weekIdx(m);
  $('range').textContent=`${fmt(m)} – ${fmt(endOf(m))}`;
  $('wkLabel').textContent=`Semana ${w+1} de ${TOTAL}`;$('wkLabel2').textContent=$('wkLabel').textContent;
  $('today').hidden=offset===0;
  $('floors').innerHTML=FLOORS.map(f=>`<div class="floor">
    <div class="fh"><h2>${f.name}</h2><small>${PEOPLE.filter(p=>p.floor===f.id).length} personas</small></div>
    <div class="people">${PEOPLE.filter(p=>p.floor===f.id).map(p=>{
      const ts=a.by[p.name];
      return `<div class="per${p.name===me?' me':''}"><div class="pn"><span class="av">${esc(p.name[0])}</span>${esc(p.name)}</div>
      ${ts.length?ts.map(t=>{const n=daysOf(m,t.id).length,f=goal(m,t);return `<button class="mag${n>=f?' full':''}" style="--c:${t.c};--f:${t.f}" data-t="${t.id}" aria-label="${esc(t.name)}: ${n} de ${f} veces. Registrar">
        <span class="mt"><span>${esc(t.name)}</span><small>${n}/${f}</small></span>
        <span class="dots">${[...Array(f)].map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span></button>`}).join(''):'<div class="free">Libre esta semana</div>'}
      </div>`}).join('')}</div></div>`).join('');
  $('legend').innerHTML=TASKS.map(t=>`<span><i style="--c:${t.c}"></i>${esc(t.name)} · ${t.freq}×/sem</span>`).join('');
  renderStrip();
}
function renderStrip(){
  const today=iso(new Date());
  const k0=weekIdx(base),pages=[];for(let i=0;i<TOTAL;i++)pages.push(i-k0);
  $('strip').innerHTML=pages.map(k=>{
    const m=addDays(base,k*7),a=assign(m),w=weekIdx(m);
    const days=[...Array(7)].map((_,i)=>{const d=addDays(m,i);return `<div class="${iso(d)===today?'td':''}${d>END_D?' off':''}"><b>${'LKMJVSD'[i]}</b><span>${d.getDate()}</span></div>`}).join('');
    const rows=TASKS.map(t=>`<div class="row"><i style="--c:${t.c}"></i><span>${esc(t.name)}</span><b class="${a.out[t.id]===me?'me':''}">${esc(a.out[t.id])}</b></div>`).join('');
    return `<button class="page${k===0&&base===realNow?' now':''}${k===offset?' sel':''}${m<realNow?' past':''}" data-k="${k}">
      <div class="ph"><div class="wk">Semana ${w+1} de ${TOTAL}</div><div class="dr">${fmt(m)} – ${fmt(endOf(m))}</div><div class="days">${days}</div></div>
      <div class="rows">${rows}</div></button>`}).join('');
  const sel=$('strip').querySelector('.sel');
  if(sel)$('strip').scrollTo({left:sel.offsetLeft-$('strip').offsetLeft-8,behavior:'smooth'});
}
$('me').innerHTML='<option value="">Soy…</option>'+PEOPLE.map(p=>`<option ${p.name===me?'selected':''}>${esc(p.name)}</option>`).join('');

/* ---- Eventos ---- */
const go=k=>{offset=k;renderHouse()};
const k0=weekIdx(base);
$('prev').onclick=()=>go(Math.max(offset-1,-k0));
$('next').onclick=()=>go(Math.min(offset+1,TOTAL-1-k0));
$('today').onclick=()=>go(0);
$('me').onchange=e=>{me=e.target.value;save();renderHouse()};
$('floors').addEventListener('click',e=>{const b=e.target.closest('.mag');if(b)openSheet(b.dataset.t)});
let sheetT=null,lastFocus=null;
function openSheet(id){sheetT=TASKS.find(t=>t.id===id);lastFocus=document.activeElement;renderSheet();$('sheet').hidden=false;$('sheetOk').focus()}
function closeSheet(){$('sheet').hidden=true;sheetT=null;renderHouse();lastFocus&&lastFocus.focus&&lastFocus.focus()}
function renderSheet(){
  if(!sheetT)return;
  const t=sheetT,m=cur(),a=assign(m),ds=daysOf(m,t.id),f=goal(m,t),today=iso(new Date());
  $('sbox').style.cssText=`--c:${t.c};--f:${t.f}`;
  $('sChip').textContent=`${fmt(m)} – ${fmt(endOf(m))}`;
  $('sTitle').textContent=t.name;
  $('sSub').textContent=`Le toca a ${a.out[t.id]} · ${f===1?'1 vez':f+' veces'} esta semana · ${ds.length} hecha${ds.length===1?'':'s'}`;
  $('sProg').style.width=Math.min(100,ds.length/f*100)+'%';
  $('sDays').innerHTML=[...Array(7)].map((_,i)=>{const d=addDays(m,i),off=d>END_D;return `<button class="day${iso(d)===today?' tdy':''}" data-d="${i}" aria-pressed="${ds.includes(i)}" ${off?'disabled':''}><span>${'LKMJVSD'[i]}</span><b>${d.getDate()}</b></button>`}).join('');
}
$('sDays').addEventListener('click',e=>{const b=e.target.closest('.day');if(!b||b.disabled)return;toggle(cur(),sheetT.id,+b.dataset.d)});
$('sheetOk').onclick=closeSheet;
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
$('strip').addEventListener('click',e=>{const p=e.target.closest('.page');if(p)go(+p.dataset.k)});
renderHouse();
load();
{const f=$('flakes');let h='';for(let i=0;i<60;i++){const x=(i*137.5)%100,y=(i*61.8)%85,r=1+(i%3)*.8;h+=`<circle cx="${x}%" cy="${y}%" r="${r}" fill="#fff" opacity="${.35+(i%4)*.15}" style="animation-delay:-${i%6}s"/>`}f.innerHTML=h}
}
</script>
</body>
</html>
